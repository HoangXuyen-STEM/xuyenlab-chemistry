name: Phase task
description: Assign a bounded task to Codex, Claude Code, Copilot or the project owner
title: "[P<N>.<task>] "
body:
  - type: input
    id: phase_task
    attributes:
      label: Phase and task ID
      placeholder: P2.1
    validations:
      required: true

  - type: input
    id: owner_model
    attributes:
      label: Owner and model
      placeholder: Codex GPT-5.6 Sol, high
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one observable outcome.
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Required inputs and prerequisites
      description: Plan, ADR, contract, prior handoff and exit gate that must be read/passed.
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed paths
      placeholder: |
        - src/components/mdx/**
        - src/features/content/**
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: Forbidden paths
      placeholder: |
        - db/migrations/**
        - src/lib/auth/**
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use verifiable checkboxes.
      placeholder: |
        - [ ] Observable behavior works
        - [ ] Tests cover success and failure cases
        - [ ] Required docs are updated
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Required verification commands
      placeholder: |
        npm run lint
        npm run typecheck
        npm test
    validations:
      required: true

  - type: input
    id: handoff
    attributes:
      label: Required handoff path
      placeholder: docs/handoffs/P2/P2.1-codex.md
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundaries
      options:
        - label: This task does not require committing or exposing secrets.
          required: true
        - label: This task does not authorize production changes unless explicitly stated above.
          required: true

