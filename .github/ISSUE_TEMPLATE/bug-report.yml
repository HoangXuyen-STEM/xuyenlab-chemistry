name: Bug report
description: Report a reproducible defect without credentials or student data
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Remove credentials and real student data.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - preview
        - staging
        - production
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Safe logs or screenshots
      description: Redact tokens, cookies, URLs with signatures and personal information.

