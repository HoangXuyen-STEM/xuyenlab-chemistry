<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" aria-hidden="true">
  <rect width="480" height="200" fill="#f5f7f6" rx="8"/>
  <line x1="60" y1="160" x2="420" y2="160" stroke="#dce3e0" stroke-width="1.5"/>
  <line x1="60" y1="160" x2="60" y2="20" stroke="#dce3e0" stroke-width="1.5"/>
  <!-- reaction coordinate curve -->
  <path d="M 60 130 C 100 130 120 60 160 55 S 220 130 260 130 C 300 130 320 40 360 35 S 400 80 420 80" fill="none" stroke="#0f6e5c" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- energy levels -->
  <line x1="50" y1="130" x2="110" y2="130" stroke="#4c5a55" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="310" y1="130" x2="360" y2="130" stroke="#4c5a55" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="80" x2="410" y2="80" stroke="#b7c2bd" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- labels -->
  <text x="240" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4c5a55">Tọa độ phản ứng</text>
  <text x="30" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4c5a55" transform="rotate(-90 30 90)">Năng lượng</text>
  <text x="80" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#0f6e5c">Chất đầu</text>
  <text x="390" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#0f6e5c">Sản phẩm</text>
  <text x="155" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8a5a00">Ea</text>
  <text x="355" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8a5a00">Ea&apos;</text>
  <!-- placeholder label -->
  <text x="240" y="14" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#8b9793">[Fixture placeholder — sẽ thay bằng hình thật từ nguồn nội dung]</text>
</svg>
